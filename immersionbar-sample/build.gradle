plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.gyf.immersionbar.sample'
    compileSdkVersion 35
    defaultConfig {
        applicationId "com.gyf.immersionbar.sample"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "$immersionbar_version"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            keyAlias 'immersionbar'
            storePassword '123456'
            keyPassword '123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion libs.versions.composeCompiler.get()
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation libs.androidx.constraintlayout
    androidTestImplementation(libs.androidx.test.espresso.core) {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    implementation libs.androidx.appcompat
    implementation libs.google.material
    implementation libs.kotlin.stdlib
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.material
    implementation libs.androidx.compose.ui.tooling.preview
    debugImplementation libs.androidx.compose.ui.tooling
    testImplementation libs.junit
    implementation project(':immersionbar')
//    implementation libs.immersionbar
//    implementation libs.immersionbar.ktx

    // Swipe back
    implementation libs.swipebacklayout
    // Logging
    implementation libs.logutils
    // Banner carousel
    implementation libs.banner
    // RecyclerView framework
    implementation libs.base.recyclerview.adapter.helper
    // Image loading framework
    implementation libs.glide
    annotationProcessor libs.glide.compiler
    // Pull to refresh and load more
    implementation libs.tkrefreshlayout
    // Circular ImageView
    implementation libs.circleimageview
    // Memory leak detection
    debugImplementation libs.leakcanary.android
    releaseImplementation libs.leakcanary.android.no.op
    testImplementation libs.leakcanary.android.no.op
    // Fragment framework
    implementation libs.fragmentationx
    // Tencent Bugly
    implementation libs.bugly.crashreport
    // Rx
    implementation libs.rxjava2
    implementation libs.rxandroid
    // EventBus
    implementation libs.eventbus

    implementation libs.blurry
    implementation libs.androidx.multidex
}
repositories {
    mavenCentral()
}
